{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicio de sesión - MusicApp Repertorio Musical y Calendario.">
  <title>Acceder | MusicApp</title>

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="{% static 'style.css' %}">

  <style>
    body {
      background-color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .login-clean-card {
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      padding: 2.5rem 2.25rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .login-brand-title {
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 2.2rem;
      color: var(--primary-blue);
      letter-spacing: -0.03em;
      margin-bottom: 0.25rem;
    }

    }
  </style>
</head>
<body>

  <div class="login-clean-card">
    
    <!-- Encabezado MusicApp -->
    <div class="text-center mb-4">
      <div class="login-brand-title">MusicApp</div>
      <p class="text-muted small mb-0">Gestión de Repertorio & Calendario de Ensayos</p>
    </div>

    <!-- Alertas -->
    {% if form.errors %}
      <div class="alert alert-danger py-2 px-3 mb-3 d-flex align-items-center" role="alert" style="border-radius: 8px; font-size: 0.85rem;">
        <i class="bi bi-exclamation-circle-fill text-danger me-2 fs-6"></i>
        <span>Usuario o contraseña incorrectos.</span>
      </div>
    {% endif %}

    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-info py-2 px-3 mb-3 small" style="border-radius: 8px;">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <!-- Formulario Django Login -->
    <form method="POST" action="{% url 'login' %}" autocomplete="off">
      {% csrf_token %}
      
      <div class="mb-3">
        <label for="id_username" class="form-label text-muted small fw-bold">Usuario</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0 text-muted" style="border-radius: var(--radius-sm) 0 0 var(--radius-sm); border-color: var(--border-light);">
            <i class="bi bi-person"></i>
          </span>
          <input 
            type="text" 
            name="username" 
            id="id_username" 
            class="form-control form-control-clean border-start-0 ps-0" 
            placeholder="Ingresa tu usuario" 
            autocomplete="username"
            required 
            autofocus>
        </div>
      </div>

      <div class="mb-3">
        <label for="id_password" class="form-label text-muted small fw-bold">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0 text-muted" style="border-radius: var(--radius-sm) 0 0 var(--radius-sm); border-color: var(--border-light);">
            <i class="bi bi-lock"></i>
          </span>
          <input 
            type="password" 
            name="password" 
            id="id_password" 
            class="form-control form-control-clean border-start-0 border-end-0 ps-0" 
            placeholder="••••••••" 
            autocomplete="current-password"
            required>
          <button 
            type="button" 
            class="btn btn-outline-secondary border-start-0 bg-white" 
            id="togglePasswordBtn" 
            style="border-color: var(--border-light); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;"
            onclick="togglePasswordVisibility()" 
            title="Mostrar u ocultar contraseña">
            <i class="bi bi-eye" id="togglePasswordIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary-blue w-100 py-2 justify-content-center mt-4 fs-6 shadow-sm">
        <i class="bi bi-box-arrow-in-right"></i>
        <span>Ingresar al Sistema</span>
      </button>
    </form>

  </div>

  <script>
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('id_password');
      const icon = document.getElementById('togglePasswordIcon');
      if (!pwdInput || !icon) return;
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        icon.className = 'bi bi-eye-slash text-primary';
      } else {
        pwdInput.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }
  </script>
</body>
</html>
